# The timer behind Aksen's unattended research agents.
#
# This calls /api/automation/tick and nothing else. It knows nothing about
# cadence, start hour or daily limits: those live in the database and are edited
# in the admin, so changing the schedule never means changing this file. Calling
# too often is harmless because the endpoint refuses anything not due.
#
# Cloudflare's own cron triggers would be the obvious home for this, but the
# Worker entry is generated by vinext, which exports no scheduled handler and
# writes an empty triggers block on every build. A timer outside the Worker does
# not get regenerated away.
#
# GitHub skips scheduled runs on repositories with no activity for 60 days, and
# a busy queue can delay a run by several minutes. Both are acceptable here: a
# search that starts at 08:40 instead of 08:00 is still that morning's search,
# and the endpoint runs a missed hour late rather than skipping the day.
name: Aksen automation heartbeat

on:
  schedule:
    # Every ten minutes, UTC. The endpoint decides whether anything happens.
    #
    # This was hourly, which was right when the only work here was research that
    # nobody is waiting on. The outbox changed that: a person who writes in at
    # 10:05 would have waited until 11:00 for the message telling them their
    # enquiry arrived, and fifty-five minutes of silence after pressing send is
    # how a visitor concludes the form is broken.
    #
    # Calling more often costs nothing. Research still runs only when its own
    # cadence says so, and a drain with an empty queue is two cheap queries.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  # A delayed run must not overlap the next hour's. The endpoint holds its own
  # lock as well, but two callers waiting on the same long search is wasted.
  group: aksen-automation
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask whether any automation is due
        env:
          TICK_URL: ${{ secrets.AUTOMATION_TICK_URL }}
          TICK_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "AUTOMATION_TICK_URL or AUTOMATION_SECRET is not set. Nothing to call."
            exit 0
          fi
          # A search runs the model chain and can take minutes, so the read
          # timeout is generous. --fail-with-body keeps the response visible
          # when the endpoint refuses, which is the only place the reason is
          # written down.
          curl --silent --show-error --fail-with-body \
            --connect-timeout 20 --max-time 540 \
            -X POST "$TICK_URL" \
            -H "x-automation-secret: $TICK_SECRET" \
            -H 'content-type: application/json'
